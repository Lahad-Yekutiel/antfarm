# Contain OpenClaw gateway + any Chrome it launches.
# Live RSS ~787 MiB, peak ~1.28 GiB (2026-08-28 after WSL reboot).
# The 52 GiB figure in the OOM log is Chrome virtual address space, not RSS.
# Cap at 4G so a leak cannot eat the 15.7 GiB VM; 2.5G high starts reclaim.
[Service]
MemoryAccounting=yes
MemoryHigh=2500M
MemoryMax=4G
