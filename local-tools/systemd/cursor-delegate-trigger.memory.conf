# Contain a runaway Cursor `agent` child (same cgroup as this unit).
# Idle RSS ~67 MiB, peak ~89 MiB after the 2026-08-28 WSL reboot.
# Today a child hit ~11.5 GiB and starved the 15.7 GiB VM (D2).
# MemoryHigh throttles; MemoryMax is a hard cap the 11.5 GiB excursion
# cannot survive. 3G still leaves room for a real implement spawn.
[Service]
MemoryAccounting=yes
MemoryHigh=2G
MemoryMax=3G
